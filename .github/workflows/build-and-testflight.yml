name: Build and TestFlight

# Unity（Windows）で書き出した Xcode プロジェクトを zip にして Release に置き、
# ここ（macOS ランナー）で署名して TestFlight へ上げる。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "ios-xcode.zip を置いた Release のタグ"
        required: true
        default: "xcode"
      upload_testflight:
        description: "TestFlightへアップロード"
        required: true
        type: boolean
        default: true

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Download Xcode project from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" -p 'ios-xcode.zip' -D dl
          mkdir xcode
          unzip -q dl/ios-xcode.zip -d xcode
          ls xcode
          test -d xcode/Unity-iPhone.xcodeproj

      - name: Install tools
        run: pip3 install --break-system-packages PyJWT requests

      - name: Set build number and plist flags
        run: |
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleVersion ${{ github.run_number }}" xcode/Info.plist
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" xcode/Info.plist 2>/dev/null || $PB -c "Set :ITSAppUsesNonExemptEncryption false" xcode/Info.plist
          $PB -c "Print" xcode/Info.plist | grep -E "CFBundle(Version|ShortVersionString|Identifier)|NonExempt"

      - name: Install App Store Connect key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          test -n "$ASC_API_KEY_CONTENT"
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

      - name: Import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERT_BASE64"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 7200 -u build.keychain
          echo "$CERT_BASE64" | base64 -D > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          security find-identity -v -p codesigning build.keychain

      - name: Prepare App Store provisioning profile
        env:
          ASC_KEY_ID: WDXGY9WX55
          ASC_ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec
          ASC_P8_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8
          BUNDLE_ID: com.tokyonasu.kawasakimahjong
          PROFILE_NAME: KawasakiMahjong App Store
        run: python3 scripts/prepare_profile.py

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/KawasakiMahjong.xcarchive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            > build/archive.log 2>&1 || { grep -E "error:|\*\* " build/archive.log | tail -60; exit 1; }
          grep -E "warning: .*sign|ARCHIVE SUCCEEDED" build/archive.log | tail -5

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: build/archive.log
          if-no-files-found: ignore

      - name: Export and upload to TestFlight
        if: inputs.upload_testflight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/KawasakiMahjong.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
            -authenticationKeyID WDXGY9WX55 \
            -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec
